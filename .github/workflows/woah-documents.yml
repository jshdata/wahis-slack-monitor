name: WOAH PDF Monitor

on:
  schedule:
    # UTC 00:00 = Asia/Seoul 09:00: full check, including PDF replacements.
    - cron: '0 0 * * *'
    # Separate retry run avoids keeping a runner idle for one hour.
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      retry_only:
        description: Retry failed or missed daily collections only
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: woah-pdf-monitor
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      DB_SSL_CA: ca.pem
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies and Chromium
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Load existing database settings
        env:
          SLACK_MONITOR_ENV: ${{ secrets.SLACK_MONITOR_ENV }}
          DB_SSL_CA_CERT: ${{ secrets.DB_SSL_CA_CERT }}
        run: |
          test -n "$SLACK_MONITOR_ENV" || { echo 'Missing SLACK_MONITOR_ENV secret'; exit 1; }
          test -n "$DB_SSL_CA_CERT" || { echo 'Missing DB_SSL_CA_CERT secret'; exit 1; }
          printf '%s\n' "$SLACK_MONITOR_ENV" > .env
          printf '%s\n' "$DB_SSL_CA_CERT" > ca.pem

      - name: Collect WOAH PDFs
        env:
          RETRY_ONLY: ${{ github.event.schedule == '0 1 * * *' || inputs.retry_only == true }}
        run: |
          if [ "$RETRY_ONLY" = "true" ]; then
            python woah_main.py --retry-scheduled
          else
            python woah_main.py
          fi
