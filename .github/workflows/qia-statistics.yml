name: QIA Monthly Quarantine Statistics

on:
  schedule:
    # Every day at 10:17 Asia/Seoul (01:17 UTC).
    # Python gates new months until the 11th and skips completed months.
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check pending months without downloading or changing the DB
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: qia-monthly-statistics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_SSL_CA: ca.pem
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Load existing database settings
        env:
          SLACK_MONITOR_ENV: ${{ secrets.SLACK_MONITOR_ENV }}
          DB_SSL_CA_CERT: ${{ secrets.DB_SSL_CA_CERT }}
        run: |
          test -n "$SLACK_MONITOR_ENV"
          test -n "$DB_SSL_CA_CERT"
          printf '%s\n' "$SLACK_MONITOR_ENV" > .env
          printf '%s\n' "$DB_SSL_CA_CERT" > ca.pem
      - name: Collect missing monthly statistics
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python -m apqa.quarantine_schedule "${args[@]}"
      - name: Retain source files and verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qia-statistics-${{ github.run_id }}
          path: data/qia_statistics/scheduled/
          if-no-files-found: ignore
          retention-days: 30
