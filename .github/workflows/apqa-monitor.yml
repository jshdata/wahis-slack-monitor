
name: APQA Import Monitor

on:
  # GitHub Actions에서 수동 실행
  workflow_dispatch:

  # 매일 한국시간 오전 8시 자동 실행
  schedule:
    - cron: "0 23 * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 저장소 코드 가져오기
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python 3.12 환경 설정
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. 필요한 라이브러리 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 기존 GitHub Secret으로 .env 생성
      - name: Create .env file
        env:
          SLACK_MONITOR_ENV: ${{ secrets.SLACK_MONITOR_ENV }}
        run: |
          printf '%s\n' "$SLACK_MONITOR_ENV" > .env

      # 5. Aiven MySQL SSL 인증서 생성
      - name: Create Aiven CA certificate
        env:
          DB_SSL_CA_CERT: ${{ secrets.DB_SSL_CA_CERT }}
        run: |
          printf '%s\n' "$DB_SSL_CA_CERT" > ca.pem

      # 6. APQA 수집 및 Aiven MySQL 동기화
      - name: Run APQA Monitor
        env:
          DB_SSL_CA: ca.pem
        run: |
          python apqa_main.py
